<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Reel — Brunna &amp; Thiago</title>
    <style>
      :root {
        --gold: #e2c27a;
        --ink: #241016;
        --cream: #f6f1e8;
        --marsala: #6e2c3d;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #14090d;
        color: var(--cream);
        font-family: Inter, "Noto Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #bg {
        position: absolute;
        inset: -40px;
        background-size: cover;
        background-position: center;
        filter: blur(28px) brightness(0.46) saturate(1.15);
        transform: scale(1.08);
      }
      body.light #bg { filter: blur(30px) brightness(0.92) saturate(0.8); }
      #view { position: absolute; inset: 0; }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff8ec;
        opacity: 0;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(0,0,0,.35), transparent 16%, transparent 68%, rgba(0,0,0,.55)),
          radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.35) 100%);
      }
      body.light #vignette { opacity: 0.35; }
      #bar {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 64px;
        height: 8px;
        border-radius: 99px;
        background: rgba(255,255,255,.18);
        overflow: hidden;
        z-index: 5;
      }
      #bar > span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #b8924a, var(--gold));
      }
      .kicker {
        position: absolute;
        top: 100px;
        left: 72px;
        right: 72px;
        z-index: 5;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        font-size: 24px;
        font-weight: 600;
        color: var(--gold);
      }
      .device {
        position: absolute;
        left: 50%;
        top: 176px;
        width: 700px;
        transform-origin: center top;
        border-radius: 36px;
        overflow: hidden;
        box-shadow:
          0 40px 90px rgba(0, 0, 0, 0.5),
          0 0 0 3px rgba(226, 194, 122, 0.45);
        z-index: 2;
      }
      .device img { display: block; width: 100%; height: auto; }
      .hook {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 520px;
        z-index: 4;
      }
      .hook h1 {
        font-family: "Noto Serif Display", Georgia, serif;
        font-weight: 600;
        font-size: 108px;
        line-height: 0.94;
        letter-spacing: -0.03em;
      }
      .hook h1 em { font-style: italic; color: var(--gold); }
      .hook p {
        margin-top: 28px;
        font-size: 36px;
        line-height: 1.3;
        color: rgba(246, 241, 232, 0.84);
      }
      .foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 4;
        padding: 90px 72px 78px;
        background: linear-gradient(180deg, transparent, rgba(12, 6, 8, 0.2) 20%, rgba(12, 6, 8, 0.88));
        font-family: "Noto Serif Display", Georgia, serif;
        font-size: 52px;
        line-height: 1.08;
        font-weight: 600;
      }
      .end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 80px;
        z-index: 4;
      }
      .end .eyebrow {
        letter-spacing: 0.38em;
        text-transform: uppercase;
        font-size: 26px;
        font-weight: 600;
        color: var(--marsala);
        margin-bottom: 28px;
      }
      .end h1 {
        font-family: "Noto Serif Display", Georgia, serif;
        font-size: 100px;
        line-height: 0.95;
        color: var(--ink);
        font-weight: 600;
      }
      .end .rule {
        width: 120px;
        height: 3px;
        background: #b8924a;
        margin: 28px auto;
      }
      .end .handle {
        font-size: 64px;
        font-weight: 700;
        color: var(--marsala);
        letter-spacing: -0.03em;
      }
      .end .fine {
        margin-top: 22px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 22px;
        font-weight: 600;
        color: #8d7380;
      }
      .word {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 4;
        font-family: "Noto Serif Display", Georgia, serif;
        font-size: 120px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bg"></div>
      <div id="view"></div>
      <div id="flash"></div>
      <div id="vignette"></div>
      <div id="bar"><span id="barFill"></span></div>
    </div>
    <script>
      (function () {
        var DURATION = 43.4;
        window.__DURATION = DURATION;
        var CUTS = [1.65, 3.15, 4.55, 6.7, 9.4, 11.9, 14.3, 16.7, 18.9, 21.8, 24.2, 26.9, 29.2, 31.7, 34.4, 37, 39.16];

        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
        function inv(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
        function ease(u) { return 1 - Math.pow(1 - clamp(u, 0, 1), 3); }
        function back(u) {
          u = clamp(u, 0, 1);
          var c = 1.25;
          return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2);
        }

        function setBg(src) {
          var bg = document.getElementById("bg");
          bg.style.backgroundImage = src ? 'url("shots/' + src + '")' : "none";
        }

        function kicker(text) {
          return '<div class="kicker">' + text + "</div>";
        }
        function foot(text) {
          return '<div class="foot">' + text + "</div>";
        }
        function device(src, local) {
          var s = 0.9 + 0.1 * back(inv(local, 0, 0.42));
          return (
            '<div class="device" style="transform:translateX(-50%) scale(' +
            s.toFixed(3) +
            ')"><img src="shots/' +
            src +
            '" alt=""></div>'
          );
        }

        function hook(t) {
          setBg("envelope.jpg");
          var s = 1.04 - 0.04 * ease(inv(t, 0, 0.4));
          return (
            '<div class="hook" style="transform:scale(' +
            s.toFixed(3) +
            ');transform-origin:left center">' +
            '<div class="kicker" style="position:static;margin-bottom:24px">o pedido</div>' +
            "<h1>Eles me pediram um convite.</h1>" +
            "<p>Não um PDF. Um link que a pessoa abre.</p></div>" +
            foot("Olha o que eu fiz.")
          );
        }

        function reveal(t) {
          var local = t - 1.65;
          setBg("envelope.jpg");
          return (
            kicker("01 · abertura") +
            device("envelope.jpg", local) +
            foot("O envelope é o gancho.")
          );
        }

        function shot(t, start, src, label, line) {
          var local = t - start;
          setBg(src);
          return kicker(label) + device(src, local) + foot(line);
        }

        function finaleWords(t) {
          var local = t - 37;
          var words = ["Abrir", "Fotos", "Data", "Mapa", "Traje", "Ritmo", "RSVP", "Presentes", "Gestão"];
          var i = Math.min(words.length - 1, Math.floor(local / 0.24));
          var u = (local - i * 0.24) / 0.24;
          var s = 0.86 + 0.14 * back(Math.min(1, u * 1.3));
          setBg("hero.jpg");
          return (
            '<div class="word" style="transform:scale(' +
            s.toFixed(3) +
            ')">' +
            words[i] +
            "</div>" +
            foot("Tudo isso. Num link.")
          );
        }

        function endCard(t) {
          var local = t - 39.16;
          var u = ease(inv(local, 0, 0.35));
          setBg("");
          document.getElementById("bg").style.backgroundImage =
            "linear-gradient(180deg,#fbf6ef,#f3e6d8)";
          return (
            '<div class="end" style="opacity:' +
            u.toFixed(3) +
            ";transform:translateY(" +
            ((1 - u) * 16).toFixed(1) +
            'px)">' +
            '<div class="eyebrow">convite digital</div>' +
            "<h1>Um link.<br>A festa inteira.</h1>" +
            '<div class="rule"></div>' +
            '<div class="handle">@arysson.dev</div>' +
            '<div class="fine">Brunna &amp; Thiago · 13 de junho de 2026</div>' +
            "</div>"
          );
        }

        function scene(t) {
          if (t < 1.65) return { light: false, html: hook(t) };
          if (t < 3.15) return { light: false, html: reveal(t) };
          if (t < 4.55) return { light: false, html: shot(t, 3.15, "open_08.jpg", "02 · monograma", "O selo vira a marca dos dois.") };
          if (t < 6.7) return { light: false, html: shot(t, 4.55, "open_27.jpg", "03 · a carta", "Brunna & Thiago saem do envelope.") };
          if (t < 9.4) return { light: false, html: shot(t, 6.7, "hero.jpg", "04 · o convite", "A frase. O nome. A foto.") };
          if (t < 11.9) return { light: false, html: shot(t, 9.4, "album.jpg", "05 · momentos", "Vira a página. São 16.") };
          if (t < 14.3) return { light: false, html: shot(t, 11.9, "data.jpg", "06 · quando", "13 de junho de 2026 · 13h.") };
          if (t < 16.7) return { light: false, html: shot(t, 14.3, "mapa.jpg", "07 · onde", "Buffet Fest Vip. O mapa abre.") };
          if (t < 18.9) return { light: false, html: shot(t, 16.7, "traje.jpg", "08 · traje", "Esporte fino. Pronto pra pista.") };
          if (t < 21.8) return { light: false, html: shot(t, 18.9, "citacao.jpg", "09 · ritmo", "13h, 14h, 16h e 18h.") };
          if (t < 24.2) return { light: false, html: shot(t, 21.8, "rsvp-cta.jpg", "10 · a chamada", "Presença e lista, no mesmo fluxo.") };
          if (t < 26.9) return { light: false, html: shot(t, 24.2, "rsvp.jpg", "11 · rsvp", "Um convite. Uma pessoa.") };
          if (t < 29.2) return { light: false, html: shot(t, 26.9, "presentes-gate.jpg", "12 · presentes", "Confirma. Aí escolhe.") };
          if (t < 31.7) return { light: false, html: shot(t, 29.2, "presentes-pix.jpg", "13 · pix", "A chave está no convite.") };
          if (t < 34.4) return { light: false, html: shot(t, 31.7, "admin-stats.jpg", "14 · gestão", "Lotação do salão. Meta 120.") };
          if (t < 37) return { light: false, html: shot(t, 34.4, "admin-form.jpg", "15 · o painel", "Presente, escolha e confirmados.") };
          if (t < 39.16) return { light: false, html: finaleWords(t) };
          return { light: true, html: endCard(t) };
        }

        function flash(t) {
          var o = 0;
          for (var i = 0; i < CUTS.length; i++) {
            var d = t - CUTS[i];
            if (d >= 0 && d < 0.08) o = Math.max(o, (1 - d / 0.08) * 0.4);
          }
          return o;
        }

        function render(t) {
          t = clamp(t, 0, DURATION);
          var s = scene(t);
          document.body.className = s.light ? "light" : "";
          document.getElementById("view").innerHTML = s.html;
          document.getElementById("flash").style.opacity = String(flash(t));
          document.getElementById("barFill").style.width = ((t / DURATION) * 100).toFixed(2) + "%";
        }

        window.__seek = function (sec) {
          render(sec);
          var pending = Array.prototype.map.call(document.images, function (img) {
            if (img.complete) return Promise.resolve();
            return img.decode ? img.decode().catch(function () {}) : Promise.resolve();
          });
          return Promise.all(pending).then(function () {
            return new Promise(function (resolve) {
              requestAnimationFrame(function () {
                requestAnimationFrame(resolve);
              });
            });
          });
        };

        var params = new URLSearchParams(location.search);
        if (params.has("t")) render(parseFloat(params.get("t")) || 0);
        else if (params.get("freeze") === "1") render(0);
        else {
          var start = performance.now();
          (function loop(now) {
            render(Math.min((now - start) / 1000, DURATION));
            requestAnimationFrame(loop);
          })(start);
        }
      })();
    </script>
  </body>
</html>
